name: CI — Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:

  # ============================================================
  # BACKEND
  # ============================================================

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mspr
          POSTGRES_PASSWORD: mspr
          POSTGRES_DB: msprds
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: API/requirements.txt

      - name: Install API dependencies
        run: |
          pip install -r API/requirements-dev.txt

      # ========================================================
      # TESTS BACKEND
      # ========================================================

      - name: Run backend tests (pytest)
        env:
          CI: true
          DATABASE_URL: postgresql://mspr:mspr@localhost:5432/msprds
          SECRET_KEY: test-secret-key
          ALGORITHM: HS256
        run: |
          cd API

          pytest \
            --cov=. \
            --cov-report=term-missing \
            --ignore=tests/test_integration_trajets.py

      # ========================================================
      # VÉRIFICATION DÉMARRAGE API
      # ========================================================

      - name: Check API starts correctly
        env:
          DATABASE_URL: postgresql://mspr:mspr@localhost:5432/msprds
          SECRET_KEY: test-secret-key
          ALGORITHM: HS256
        run: |
          cd API

          timeout 10 uvicorn main:app \
            --host 0.0.0.0 \
            --port 8000 &

          sleep 5

          curl -f http://localhost:8000/docs

          echo "✅ API démarrée avec succès"


  # ============================================================
  # FRONTEND
  # ============================================================

  test-frontend:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: app/requirements.txt

      - name: Install frontend dependencies
        run: |
          pip install -r app/requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile app/app.py

      - name: Verify frontend starts
        run: |
          timeout 10 streamlit run app/app.py \
            --logger.level=error &

          sleep 5

          echo "✅ Frontend Streamlit démarrée avec succès"


  # ============================================================
  # E2E
  # ============================================================

  e2e:
    runs-on: ubuntu-latest

    needs:
      - test
      - test-frontend

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      # ========================================================
      # PYTHON
      # ========================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      # ========================================================
      # DÉPENDANCES
      # ========================================================

      - name: Install dependencies
        run: |
          pip install -r API/requirements.txt
          pip install -r app/requirements.txt
          pip install -r e2e/requirements.txt

      # ========================================================
      # PLAYWRIGHT
      # ========================================================

      - name: Install Playwright Chromium
        run: |
          python -m playwright install chromium

      # ========================================================
      # API
      # ========================================================

      - name: Start API
        env:
          DATABASE_URL: sqlite:///./e2e.db
          SECRET_KEY: e2e-secret
          ALGORITHM: HS256
        run: |

          echo "=========================================="
          echo "              DÉMARRAGE API"
          echo "=========================================="

          cd API

          python -m uvicorn main:app \
            --host 127.0.0.1 \
            --port 8000 \
            > api.log 2>&1 &

          API_PID=$!

          echo "API PID : $API_PID"

          cd ..

          echo "⏳ Attente du démarrage de l'API..."

          for i in $(seq 1 30); do

            if curl -sf http://127.0.0.1:8000/ > /dev/null; then
              echo "✅ API disponible"
              break
            fi

            if ! kill -0 "$API_PID" 2>/dev/null; then

              echo "❌ L'API s'est arrêtée."

              echo ""
              echo "========== API LOG =========="

              cat API/api.log || true

              exit 1
            fi

            echo "Tentative $i/30..."

            sleep 1

          done

          if ! curl -sf http://127.0.0.1:8000/ > /dev/null; then

            echo "❌ API inaccessible après 30 secondes."

            echo ""
            echo "========== API LOG =========="

            cat API/api.log || true

            exit 1

          fi

          echo "✅ API prête pour les tests E2E"


      # ========================================================
      # STREAMLIT
      # ========================================================

      - name: Start Streamlit
        env:
          API_URL: http://127.0.0.1:8000
        run: |

          echo "=========================================="
          echo "          DÉMARRAGE STREAMLIT"
          echo "=========================================="

          streamlit run app/app.py \
            --server.address 127.0.0.1 \
            --server.port 8501 \
            --server.headless true \
            --logger.level error \
            > streamlit.log 2>&1 &

          STREAMLIT_PID=$!

          echo "Streamlit PID : $STREAMLIT_PID"

          echo "⏳ Attente du démarrage de Streamlit..."

          for i in $(seq 1 30); do

            if curl -sf http://127.0.0.1:8501/ > /dev/null; then
              echo "✅ Streamlit disponible"
              break
            fi

            if ! kill -0 "$STREAMLIT_PID" 2>/dev/null; then

              echo "❌ Streamlit s'est arrêtée."

              echo ""
              echo "========== STREAMLIT LOG =========="

              cat streamlit.log || true

              exit 1
            fi

            echo "Tentative $i/30..."

            sleep 1

          done

          if ! curl -sf http://127.0.0.1:8501/ > /dev/null; then

            echo "❌ Streamlit inaccessible après 30 secondes."

            echo ""
            echo "========== STREAMLIT LOG =========="

            cat streamlit.log || true

            exit 1

          fi

          echo "✅ Streamlit prête pour les tests E2E"


      # ========================================================
      # TESTS E2E
      # ========================================================

      - name: Run E2E tests
        env:
          CI: "true"
          API_URL: http://127.0.0.1:8000
          STREAMLIT_URL: http://127.0.0.1:8501
          E2E_TEST_MODE: "1"
        run: |

          echo "=========================================="
          echo "             TESTS E2E"
          echo "=========================================="

          echo ""
          echo "API :"

          curl -f http://127.0.0.1:8000/

          echo ""
          echo "Streamlit :"

          curl -f http://127.0.0.1:8501/ > /dev/null

          echo ""
          echo "Processus :"

          ps aux | grep -E "uvicorn|streamlit" | grep -v grep || true

          echo ""
          echo "=========================================="
          echo "          LANCEMENT PLAYWRIGHT"
          echo "=========================================="

          cd e2e

          pytest -v -s


      # ========================================================
      # LOGS API
      # ========================================================

      - name: Display API logs
        if: always()
        run: |

          echo "========== API LOG =========="

          cat API/api.log || true


      # ========================================================
      # LOGS STREAMLIT
      # ========================================================

      - name: Display Streamlit logs
        if: always()
        run: |

          echo "========== STREAMLIT LOG =========="

          cat streamlit.log || true