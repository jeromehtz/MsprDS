name: CI — Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mspr
          POSTGRES_PASSWORD: mspr
          POSTGRES_DB: msprds
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: API/requirements.txt

      - name: Install API dependencies
        run: pip install -r API/requirements-dev.txt

      # ── Tests unitaires + intégration backend ──────────────────
      # Les tests utilisent PostgreSQL en CI (grâce à la variable CI=true),
      # et SQLite en mémoire en local (conftest.py détecte l'environnement).
      # tests/test_integration_trajets.py est exclu : ces tests appellent la
      # sandbox Business Central réelle (credentials/API externe), non mockée,
      # et ne doivent pas conditionner la CI. À réintégrer avec un mock BC.
      - name: Run backend tests (pytest)
        env:
          CI: true
          DATABASE_URL: postgresql://mspr:mspr@localhost:5432/msprds
          SECRET_KEY: test-secret-key
          ALGORITHM: HS256
        run: |
          cd API
          pytest --cov=. --cov-report=term-missing --ignore=tests/test_integration_trajets.py

      - name: Check API starts correctly
        env:
          DATABASE_URL: postgresql://mspr:mspr@localhost:5432/msprds
        run: |
          cd API
          timeout 10 uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 5
          curl -f http://localhost:8000/docs || exit 1
          echo "✅ API démarrée avec succès"

  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: app/requirements.txt

      - name: Install frontend dependencies
        run: pip install -r app/requirements.txt

      - name: Check Python syntax
        run: python -m py_compile app/app.py

      - name: Verify frontend starts
        run: |
          timeout 10 streamlit run app/app.py --logger.level=error &
          sleep 5
          echo "✅ Frontend Streamlit démarrée avec succès"

  e2e:
    runs-on: ubuntu-latest
    needs: [test, test-frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies (API + frontend + e2e)
        run: |
          pip install -r API/requirements.txt
          pip install -r app/requirements.txt
          pip install -r e2e/requirements.txt

      - name: Install Playwright browser (chromium)
        run: python -m playwright install --with-deps chromium

      - name: Start API (SQLite)
        env:
          DATABASE_URL: sqlite:///./e2e.db
          SECRET_KEY: e2e-secret
          ALGORITHM: HS256
        run: |
          cd API
          nohup uvicorn main:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8000/ && break || sleep 2
          done

      - name: Start Streamlit frontend
        env:
          API_URL: http://127.0.0.1:8000
        run: |
          nohup streamlit run app/app.py --server.port 8501 --server.headless true --logger.level error > streamlit.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://localhost:8501/ && break || sleep 2
          done

      - name: Run E2E tests (Playwright)
        env:
          CI: "true"
          STREAMLIT_URL: http://localhost:8501
          API_URL: http://127.0.0.1:8000
          E2E_TEST_MODE: "1"
        run: |
          cd e2e
          pytest