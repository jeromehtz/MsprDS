services:
  db:
    image: postgres:16-alpine
    container_name: msprds_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: MSPR
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── API FastAPI ──────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: msprds_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - API/.env
    environment:
      # MLflow : passer USE_MLFLOW=true pour servir le modèle depuis le registry
      MLFLOW_TRACKING_URI: http://mlflow:5000
      USE_MLFLOW: ${USE_MLFLOW:-false}
    ports:
      - "8000:8000"
    volumes:
      - ./API:/app
      - ./model:/model:ro
      - ./data:/data:ro

  # ─── Frontend Streamlit ──────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: msprds_frontend
    restart: unless-stopped
    depends_on:
      - api
    environment:
      - API_URL=http://api:8000
    ports:
      - "8501:8501"
    volumes:
      - ./app:/app

  # ─── Monitoring (à activer quand le monitoring sera prêt) ─────
  prometheus:
    image: prom/prometheus:latest
    container_name: msprds_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"

  grafana:
    image: grafana/grafana:latest
    container_name: msprds_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro

  # ─── MLflow (tracking + model registry) ──────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: msprds_mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      # Autorise l'accès depuis les autres conteneurs (Host: mlflow:5000) — réseau privé Docker
      MLFLOW_SERVER_ALLOWED_HOSTS: "*"
    volumes:
      - mlflow_data:/mlflow
    command: >-
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  mlflow_data:
